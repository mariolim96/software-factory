[project]
name = "software-factory"
version = "0.1.0"
description = "A software factory for Claude Code that works through Odoo Project tasks: triage, sub-tasks, spec, build, gate, review, merge."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
sf = "software_factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
